<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>予約表を読み込んでいます…</title>
<style>body{font-family:system-ui,"Hiragino Kaku Gothic ProN","Yu Gothic UI",Meiryo,sans-serif;display:grid;place-items:center;height:100vh;margin:0;background:#f2f3f7;color:#1f232e}div{text-align:center}b{font-size:17px;display:block}small{color:#5c6270;display:block;margin-top:10px;font-size:13px}.bar{width:180px;height:6px;background:#e3e5ee;border-radius:3px;margin:16px auto 0;overflow:hidden}.bar i{display:block;height:100%;width:40%;background:#1a46d8;border-radius:3px;animation:slide 1.1s ease-in-out infinite alternate}@keyframes slide{from{margin-left:0}to{margin-left:60%}}</style>
</head><body><div><b>予約表を読み込んでいます…</b><small>自動で最新バージョンへ移動します</small><div class="bar"><i></i></div></div>
<script>
(function(){
  var BASE='https://keiaizawa1212-cmd.github.io/cleanreserve-/';
  var FALLBACK=11;
  var done=false;
  function go(v){ if(done) return; done=true;
    location.replace(BASE+'v'+v+'/?t='+Date.now()); }
  if(window.fetch){
    fetch('https://cleanreserve-cd29a-default-rtdb.firebaseio.com/meta/appVersion.json',{cache:'no-store'})
      .then(function(r){ return r.json(); })
      .then(function(v){ go(Math.max(Number(v)||0, FALLBACK)); })
      .catch(function(){ go(FALLBACK); });
  } else { go(FALLBACK); }
  setTimeout(function(){ go(FALLBACK); }, 4000);
})();
</script></body></html>
